{% extends "base.html" %}

{% block title %}{{ i18n.reset_title }} | {{ i18n.site_title }}{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="container py-5">
        <div class="auth-card-wrap">
            <h1 class="auth-title">{{ i18n.reset_title }}</h1>
            <div class="auth-panel">
                <form method="post">
                    {% csrf_token %}
                    <label class="auth-label" for="id_email">Email</label>
                    {{ form.email }}
                    {% if form.email.errors %}<div class="auth-error">{{ form.email.errors|striptags }}</div>{% endif %}
                    <button class="auth-btn" type="submit">{{ i18n.reset_btn }}</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
