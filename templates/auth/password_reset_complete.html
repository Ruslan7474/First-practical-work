{% extends "base.html" %}

{% block title %}{{ i18n.password_updated }} | {{ i18n.site_title }}{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="container py-5">
        <div class="auth-card-wrap">
            <h1 class="auth-title">{{ i18n.password_updated }}</h1>
            <div class="auth-panel">
                <p class="auth-note">{{ i18n.password_updated_note }}</p>
                <a class="auth-btn auth-btn-link" href="{% url 'users:login' %}?tab=email">{{ i18n.auth_login_btn }}</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
